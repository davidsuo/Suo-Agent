name: CI & CD Pipeline

on:
  push:
    branches: [ "main", "RAG_V2_EXPERIMENTAL" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
      MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
      MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      BAIDU_ASR_API_KEY: ${{ secrets.BAIDU_ASR_API_KEY }}
      BAIDU_ASR_SECRET_KEY: ${{ secrets.BAIDU_ASR_SECRET_KEY }}
      HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 【新增】缓存 HuggingFace 模型（GTE-small + Reranker，约 1.1GB）
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-hf-models-v1
          restore-keys: |
            ${{ runner.os }}-hf-models-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # 【新增】预置测试数据文件，让 LLM 看到 coffee_sales.csv 等数据源
      # 【新增】预置测试数据文件 + 生成最小化 rag_data.json（让 LLM 看到数据源）
      - name: Prepare test data
        run: |
          mkdir -p uploads
          if [ -d "data/samples" ]; then
            cp -v data/samples/*.csv uploads/ 2>/dev/null || true
          fi
          # 生成 rag_data.json 骨架，让 _discover_data_sources 能列出文件
          cat > uploads/rag_data.json << 'EOF'
          {
            "files": [
              {
                "file_name": "coffee_sales.csv",
                "tags": "咖啡销售测试数据",
                "schema": {
                  "row_count": 3636,
                  "columns": [
                    {"name": "date", "type": "date"},
                    {"name": "coffee_name", "type": "category"},
                    {"name": "price", "type": "numeric"}
                  ]
                }
              }
            ],
            "store": {}
          }
          EOF
          echo "uploads/ 目录内容："
          ls -la uploads/ || true
          echo "rag_data.json 内容："
          cat uploads/rag_data.json

      - name: Start Backend Server
        run: |
          nohup python -m uvicorn common.main:app --host 127.0.0.1 --port 10000 > backend.log 2>&1 &
          echo "Waiting for backend to start..."
          for i in $(seq 1 40); do
            if curl -s http://127.0.0.1:10000/api/health > /dev/null; then
              echo "Backend is ready!"
              exit 0
            fi
            sleep 5
          done
          echo "Backend failed to start. Dumping logs:"
          cat backend.log
          exit 1

      - name: Run Regression Tests
        run: python rag_test/regression/run_all.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Frontend
        run: cd frontend && npm ci && npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"