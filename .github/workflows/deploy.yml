name: CI & CD Pipeline

on:
  push:
    branches: [ "main", "RAG_V2_EXPERIMENTAL" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # Job 1: 回归测试与前端构建检查（CI）
  # ==========================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # 【新增】启动 FastAPI 后端并等待其就绪
      - name: Start Backend Server
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # （把你 .env 里所有需要的 Key 都加上）
        run: |
          nohup python -m uvicorn common.main:app --host 127.0.0.1 --port 10000 > backend.log 2>&1 &
          echo "Waiting for backend to start..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:10000/api/health > /dev/null; then
              echo "Backend is ready!"
              exit 0
            fi
            sleep 5
          done
          echo "Backend failed to start. Dumping logs:"
          cat backend.log
          exit 1

      - name: Run Regression Tests
        run: python rag_test/regression/run_all.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Frontend
        run: cd frontend && npm ci && npm run build

  # ==========================================
  # Job 2: 触发 Render 部署（CD）
  # ==========================================
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"